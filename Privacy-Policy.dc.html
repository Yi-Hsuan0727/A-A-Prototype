<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Questrial&amp;family=IBM+Plex+Mono:wght@400&amp;family=Noto+Sans+TC:wght@400&amp;display=swap" rel="stylesheet">
<template id="__bundler_thumbnail" data-bg-color="#0B0B0B">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><rect width="240" height="240" fill="#0B0B0B"/><rect x="72" y="96" width="96" height="10" fill="#0028FF"/><rect x="72" y="118" width="96" height="10" fill="#FFFFFF"/><rect x="72" y="140" width="58" height="10" fill="#FFFFFF" opacity="0.5"/></svg>
</template>
<style>
  html, body { margin:0; padding:0; background:#FFFFFF; }
  body { font-family:'Questrial', 'Noto Sans TC', system-ui, sans-serif; color:#0B0B0B; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:#0028FF; text-decoration:none; }
  a:hover { color:#001FBF; }
  html[lang="zh-Hant"] h1, html[lang="zh-Hant"] h2 { letter-spacing:0 !important; }
</style>
</helmet>

<div style="width:100%; background:#FFFFFF; overflow-x:clip">

  <dc-import name="SiteHeader" style="position:sticky; top:0; z-index:50" lang="{{ lang }}" active="none" on-set-lang="{{ setLang }}" on-contact="{{ openContact }}" hint-size="100%,76px"></dc-import>

  <section style="background:#FFFFFF">
    <div style="max-width:820px; margin:0 auto; padding:clamp(48px,6vw,80px) clamp(18px,4vw,48px) clamp(64px,8vw,110px)">
      <div style="display:flex; align-items:center; gap:14px; margin-bottom:26px">
        <span style="width:28px; height:1px; background:#0028FF"></span>
        <span style="font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:#6E7373">{{ t.kicker }}</span>
      </div>
      <h1 style="margin:0; font-size:clamp(32px,4.6vw,48px); line-height:1.1; letter-spacing:-1.2px; font-weight:400; text-wrap:pretty">{{ t.h1 }}</h1>
      <div style="font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:#6E7373; margin-top:22px">{{ t.effective }}</div>
      <p style="margin:28px 0 0; font-size:16.5px; line-height:1.75; color:#4A5057; max-width:680px; text-wrap:pretty">{{ t.intro }}</p>

      <div style="margin-top:clamp(40px,5vw,56px); display:flex; flex-direction:column; gap:clamp(32px,4vw,44px)">
        <sc-for list="{{ sections }}" as="s" hint-placeholder-count="11">
          <div>
            <h2 style="margin:0; font-size:clamp(19px,2.2vw,23px); line-height:1.3; letter-spacing:-0.3px; font-weight:400; color:#0B0B0B">{{ s.num }}. {{ s.title }}</h2>
            <p style="margin:14px 0 0; font-size:15.5px; line-height:1.75; color:#4A5057; text-wrap:pretty">{{ s.body }}</p>
            <sc-if value="{{ s.hasList }}" hint-placeholder-val="{{ false }}">
              <div style="margin-top:14px; display:flex; flex-direction:column; gap:8px">
                <sc-for list="{{ s.items }}" as="it" hint-placeholder-count="4">
                  <span style="display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.6; color:#4A5057">
                    <span style="width:5px; height:5px; background:#0028FF; margin-top:8px; flex:none; border-radius:3px"></span>
                    <span>{{ it }}</span>
                  </span>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="margin-top:clamp(40px,5vw,56px); padding-top:28px; border-top:1px solid #E2E5EA">
        <div style="font-size:15.5px; line-height:1.75; color:#4A5057">{{ t.contactLine }} <a href="tel:+18885238168">888-523-8168</a></div>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" lang="{{ lang }}" hint-size="100%,420px"></dc-import>
  <dc-import name="ContactModal" lang="{{ lang }}" open="{{ contactOpen }}" on-close="{{ closeContact }}" hint-size="100%,0px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  state = { lang: this.readLang(), contactOpen: false };

  readLang(){
    try {
      const q = new URLSearchParams(window.location.search).get('lang');
      if (q === 'zh' || q === 'en') { localStorage.setItem('aa_lang', q); return q; }
      return localStorage.getItem('aa_lang') === 'zh' ? 'zh' : 'en';
    } catch (e) { return 'en'; }
  }
  applyLang(l){ if (typeof document !== 'undefined') document.documentElement.lang = l === 'zh' ? 'zh-Hant' : 'en'; }
  setLang = (l) => { this.setState({ lang: l }); try { localStorage.setItem('aa_lang', l); } catch (e) {} this.applyLang(l); };
  openContact = () => this.setState({ contactOpen: true });
  closeContact = () => this.setState({ contactOpen: false });
  componentDidMount(){ this.applyLang(this.state.lang); }

  T = {
    en: {
      kicker: 'Legal', h1: 'Privacy Policy', effective: 'Effective January 1, 2026',
      intro: 'Ascenzi & Associates LLC ("Ascenzi & Associates," "we," "us," or "our") respects your privacy. This policy explains what information we collect through this website, how we use it, and the choices you have. By using this site, you agree to the practices described below.',
      contactLine: 'Questions about this policy? Contact us at'
    },
    zh: {
      kicker: '法律資訊', h1: '隱私權政策', effective: '生效日期：2026 年 1 月 1 日',
      intro: 'Ascenzi & Associates LLC（以下稱「本公司」、「我們」）重視您的隱私。本政策說明我們透過本網站蒐集哪些資訊、如何使用這些資訊，以及您所擁有的選擇。使用本網站即表示您同意以下所述之作法。',
      contactLine: '對本政策有任何疑問？請聯絡我們：'
    }
  };

  SECTIONS = {
    en: [
      { title: 'Information We Collect', body: 'We collect information you provide directly, such as your name, company, email address, phone number and any details you share through the enquiry or newsletter forms. We also automatically collect limited technical information — browser type, device type and pages visited — through standard web server logs and cookies.' },
      { title: 'How We Use Your Information', body: 'We use the information you provide to respond to enquiries, evaluate potential engagements, send requested updates, and improve this website. We do not use your information for automated decision-making with legal or similarly significant effects.' },
      { title: 'Cookies and Similar Technologies', body: 'This site uses a minimal set of cookies to remember your language preference and to understand overall site usage. You can disable cookies in your browser settings; doing so may affect some site functionality.' },
      { title: 'How We Share Information', body: 'We do not sell your personal information. We may share it with service providers who help us operate this website (such as hosting and email delivery), or when required by law, to protect our rights, or in connection with a merger, acquisition or asset sale.', hasList: true, items: ['Service providers acting on our behalf and bound by confidentiality obligations', 'Legal or regulatory authorities, where required by applicable law', 'A successor entity in the event of a merger, acquisition or reorganization'] },
      { title: 'Data Security', body: 'We use reasonable administrative, technical and physical safeguards designed to protect the information we hold. No method of transmission or storage is completely secure, and we cannot guarantee absolute security.' },
      { title: 'Data Retention', body: 'We retain personal information for as long as necessary to fulfil the purposes described in this policy, respond to your enquiry, comply with our legal obligations, and resolve disputes.' },
      { title: 'Your Rights and Choices', body: 'Depending on where you live, you may have the right to access, correct, delete, or receive a copy of your personal information, and to object to or restrict certain processing. To exercise any of these rights, contact us using the details below.' },
      { title: "Children's Privacy", body: 'This website is intended for business audiences and is not directed at children under 16. We do not knowingly collect personal information from children.' },
      { title: 'International Data Transfers', body: 'Ascenzi & Associates is based in the United States. If you access this site from outside the United States, your information may be transferred to, stored, and processed in the United States or other countries with different data protection laws.' },
      { title: 'Changes to This Policy', body: 'We may update this policy from time to time to reflect changes in our practices or for legal, operational or regulatory reasons. The "Effective" date above indicates when this policy was last revised.' },
      { title: 'Contact Us', body: 'If you have questions about this policy or how we handle your information, reach out using the contact details at the bottom of this page or through the enquiry form.' }
    ],
    zh: [
      { title: '我們蒐集的資訊', body: '我們會蒐集您直接提供的資訊，例如姓名、公司、電子郵件、電話號碼，以及您透過諮詢表單或電子報訂閱所提供的其他內容。我們也會透過標準伺服器紀錄與 Cookie，自動蒐集有限的技術資訊，例如瀏覽器類型、裝置類型與瀏覽頁面。' },
      { title: '我們如何使用您的資訊', body: '我們使用您提供的資訊來回覆諮詢、評估潛在合作機會、寄送您要求的更新內容，並改善本網站。我們不會將您的資訊用於具有法律或類似重大影響的自動化決策。' },
      { title: 'Cookie 與類似技術', body: '本網站僅使用少量 Cookie，用於記住您的語言偏好並了解整體使用情形。您可以在瀏覽器設定中停用 Cookie；這麼做可能會影響部分網站功能。' },
      { title: '我們如何分享資訊', body: '我們不會出售您的個人資訊。我們可能會與協助我們營運本網站的服務供應商（例如主機代管與電子郵件寄送）分享資訊，或在法律要求、為保護我們的權利，或涉及合併、收購或資產出售時分享資訊。', hasList: true, items: ['代表我們行事、並受保密義務約束的服務供應商', '適用法律要求之情況下的法律或主管機關', '合併、收購或重組情況下的後續公司'] },
      { title: '資料安全', body: '我們採取合理的行政、技術與實體防護措施，以保護我們持有的資訊。然而，沒有任何傳輸或儲存方式是絕對安全的，我們無法保證絕對的安全性。' },
      { title: '資料保存', body: '我們會在達成本政策所述目的、回覆您的諮詢、遵守法律義務，以及解決爭議所需的期間內，保存個人資訊。' },
      { title: '您的權利與選擇', body: '依您所在地區之不同，您可能有權存取、更正、刪除或取得您個人資訊的副本，並對特定處理方式提出異議或要求限制。如欲行使上述任何權利，請透過以下聯絡方式與我們聯繫。' },
      { title: '兒童隱私', body: '本網站主要面向企業客群，並非針對 16 歲以下兒童所設計。我們不會在知情的情況下蒐集兒童的個人資訊。' },
      { title: '跨國資料傳輸', body: 'Ascenzi & Associates 總部位於美國。若您從美國以外地區瀏覽本網站，您的資訊可能會被傳輸、儲存並處理於美國或其他資料保護法規不同的國家。' },
      { title: '本政策之變更', body: '我們可能會不時更新本政策，以反映我們作法之變更，或因法律、營運或法規因素而調整。上方之「生效日期」即代表本政策最近一次修訂的時間。' },
      { title: '聯絡我們', body: '如您對本政策或我們處理資訊的方式有任何疑問，請透過本頁下方之聯絡資訊或諮詢表單與我們聯繫。' }
    ]
  };

  renderVals(){
    const L = this.state.lang, t = this.T[L];
    return {
      lang: L,
      t,
      setLang: this.setLang,
      contactOpen: this.state.contactOpen,
      openContact: this.openContact,
      closeContact: this.closeContact,
      sections: this.SECTIONS[L].map((s, i) => ({ num: i + 1, title: s.title, body: s.body, hasList: !!s.hasList, items: s.items || [] }))
    };
  }
}
</script>
</body>
</html>
